<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#0f2027"/>
      <stop offset="100%" style="stop-color:#1a0a0f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c62b3a"/>
      <stop offset="100%" style="stop-color:#8d182a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#c62b3a" stroke-width="0.3" opacity="0.15">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Floating particles -->
  <g fill="#c62b3a" opacity="0.4" filter="url(#glow)">
    <circle cx="80" cy="80" r="2"/>
    <circle cx="650" cy="120" r="1.5"/>
    <circle cx="720" cy="300" r="2.5"/>
    <circle cx="150" cy="380" r="1.5"/>
    <circle cx="500" cy="60" r="2"/>
    <circle cx="350" cy="410" r="1.5"/>
  </g>

  <!-- Circuit lines decoration -->
  <g stroke="#00ff88" stroke-width="1" opacity="0.12" fill="none">
    <polyline points="50,200 120,200 120,160 200,160"/>
    <circle cx="120" cy="200" r="3" fill="#00ff88"/>
    <polyline points="600,350 650,350 650,300 750,300"/>
    <circle cx="650" cy="350" r="3" fill="#00ff88"/>
  </g>

  <!-- Shield icon -->
  <g transform="translate(570, 80)">
    <path d="M100,10 L190,50 L190,130 C190,175 100,210 100,210 C100,210 10,175 10,130 L10,50 Z"
          fill="url(#shield)" opacity="0.9"/>
    <!-- Lock icon inside shield -->
    <rect x="78" y="110" width="44" height="36" rx="4" fill="white" opacity="0.9"/>
    <path d="M88,110 L88,95 C88,82 112,82 112,95 L112,110" fill="none" stroke="white" stroke-width="5" opacity="0.9"/>
    <circle cx="100" cy="128" r="6" fill="#c62b3a"/>
  </g>

  <!-- Binary code rain effect -->
  <g fill="#00ff88" opacity="0.06" font-family="monospace" font-size="11">
    <text x="30" y="30">10110011</text>
    <text x="30" y="70">01001101</text>
    <text x="30" y="110">11010110</text>
    <text x="30" y="150">00110101</text>
    <text x="730" y="180">10110011</text>
    <text x="730" y="220">01101001</text>
    <text x="730" y="260">11001010</text>
  </g>

  <!-- Red accent line -->
  <rect x="0" y="0" width="6" height="450" fill="#c62b3a"/>

  <!-- Title -->
  <text x="80" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="42"
        font-weight="800" fill="#ffffff" letter-spacing="-1">
    Ciberseguridad
  </text>
  <text x="80" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="24"
        font-weight="400" fill="#e8717c" letter-spacing="1">
    Profesional
  </text>

  <!-- Subtitle -->
  <text x="80" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="14"
        fill="#888888">
    Protección de Sistemas · Redes · Identidad Digital
  </text>

  <!-- TAU tag -->
  <rect x="80" y="330" width="90" height="26" rx="13" fill="#c62b3a"/>
  <text x="125" y="348" font-family="'Segoe UI', Arial, sans-serif" font-size="12"
        font-weight="700" fill="white" text-anchor="middle">TAU · CESMAG</text>
</svg>
